<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Barnet Roleplay</title>
    <link rel="icon" type="image/png" href="BRP_-_Logo_1.png">
    <style>
        :root{--brand:#0b1f3a;--muted:#f3f6f9;--card-border:#0b1f3a}
        body{font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;background:#efefef;margin:0;color:#222}
        header{background:var(--brand);color:#fff;padding:12px 18px}
        .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
        .header-inner a{color:#fff;text-decoration:none;margin-left:14px}
        main{max-width:1200px;margin:24px auto;padding:18px}
        h1{color:var(--brand);margin:0 0 10px}
        section.group{background:#fff;border-radius:8px;padding:14px;margin-bottom:18px;box-shadow:0 6px 20px rgba(11,31,58,0.06)}
        section.group h2{margin:0 0 12px;padding:8px 10px;background:var(--muted);border-radius:6px;color:#333;font-size:18px}
        .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
        .card{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--card-border);border-radius:6px;background:#fff}
        .card.alt{border-color:#c44}
        .badge{width:64px;height:64px;background:#fff;border-radius:6px;border:1px solid #ddd;display:flex;align-items:center;justify-content:center}
        .meta{flex:1}
        .meta .code{font-weight:700;color:var(--brand)}
        .meta .role{color:#666;margin-top:6px}
        @media(max-width:600px){.card{flex-direction:row;gap:10px}}
        .note{font-size:13px;color:#666;margin-top:8px}
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div style="display:flex;align-items:center;gap:12px"><img src="BRP_-_Logo_1.png" alt="Barnet Roleplay logo" style="height:36px"><strong>Barnet Roleplay</strong></div>
            <nav>
                <a href="index.html">Homepage</a>
                <a href="rules.html">Rules</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="group">
            <h1>This page is unavailable.</h1>
            <p class="note">The previous command section has been removed.</p>
        </section>
    </main>
</body>
</html>
